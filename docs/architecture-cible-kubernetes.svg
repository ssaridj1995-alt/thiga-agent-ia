<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1230" version="1.1" viewBox="0 0 1900 1230" width="1900" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>THIGA — Schéma d’architecture</title><desc>Proposition Kubernetes managé non déployée, basée sur D03/D04/D06/D07/D09/D10/D11/D12, avec composants de production et gates de souveraineté à qualifier.</desc><defs><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#285c80" /></marker><marker id="arrow-control" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#b07832" /></marker></defs><rect fill="#ffffff" height="1230" width="1900" x="0" y="0" /><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" x="48" y="60">THIGA | Architecture cible d’industrialisation Kubernetes</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" x="49" y="92">TRAJECTOIRE PROPOSÉE · pas de cluster déployé, pas de haute disponibilité ou conformité certifiée</text><rect fill="#fff2df" height="31" rx="16" ry="16" stroke="none" stroke-width="0" width="385" x="1465" y="47" /><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1477" y="69">CIBLE · Options à qualifier, pas ratifiées</text><rect fill="#f7fafc" height="777" rx="20" ry="20" stroke="#b4cbd6" stroke-width="1.9" width="543" x="42" y="140" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" x="62" y="172">HORS CLUSTER · PERSONNES ET TIERS</text><rect fill="#fff" height="121" rx="14" ry="14" stroke="#b4cbd4" stroke-width="1.6" width="489" x="68" y="215" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="87" y="243">ACCÈS COLLABORATEUR / MANAGER</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="87" y="276">Navigateur interne</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="87" y="306">Session utilisateur, poste de travail</text><rect fill="#fff8ed" height="135" rx="14" ry="14" stroke="#e2bd85" stroke-width="1.6" width="489" x="68" y="390" /><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="87" y="418">FOURNISSEUR D’IDENTITÉ · EXTERNE OU INTERNE</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="87" y="451">IdP / SSO OIDC</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="87" y="481">Authentification ; assertions et audience</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="87" y="505">Chaîne d’identité RH à spécifier</text><rect fill="#fff" height="152" rx="14" ry="14" stroke="#b4cbd4" stroke-width="1.6" width="489" x="68" y="619" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="87" y="647">CHAÎNE D’APPROVISIONNEMENT SÉPARÉE</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="87" y="680">Registre / artefacts signés</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="87" y="710">Images OCI, poids et manifestes vérifiés</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="87" y="734">Aucun flux de données RH vers les registres</text><rect fill="#fff3e1" height="81" rx="12" ry="12" stroke="#dcb27d" stroke-width="1.7" width="489" x="68" y="807" /><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" x="87" y="838">Cloud : OUTSCALE OKS envisagé ; OVHcloud, Cloud</text><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" x="87" y="865">Temple, S3NS et autres options à comparer.</text><rect fill="#f4fafc" height="777" rx="22" ry="22" stroke="#8eaebc" stroke-dasharray="10,7" stroke-width="2" width="1239" x="618" y="140" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" x="643" y="174">CLUSTER MANAGÉ EN RÉGION À QUALIFIER · FRONTIÈRE PRIVÉE</text><text fill="#087f81" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" x="643" y="203">CNI vérifié : NetworkPolicies ingress / egress refusées par défaut + exceptions explicites</text><rect fill="#f0faf9" height="139" rx="14" ry="14" stroke="#81bab7" stroke-width="1.6" width="330" x="654" y="265" /><text fill="#087f81" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="673" y="293">ENTRÉE UNIQUE · CONTRÔLÉE</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="673" y="326">Ingress TLS privé</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="673" y="356">Authentification / accès ; aucun</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="673" y="380">port public vers MCP / Ollama</text><rect fill="#f4f9fc" height="139" rx="14" ry="14" stroke="#91b7cd" stroke-width="1.6" width="336" x="1032" y="265" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1051" y="293">POOL APPLICATIF · DEPLOYMENT ENVISAGÉ</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="1051" y="326">Open WebUI</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1051" y="356">Session, chat, appels d’outils</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1051" y="380">État externalisé avant replicas</text><rect fill="#f5fbf6" height="139" rx="14" ry="14" stroke="#9bbfa7" stroke-width="1.6" width="403" x="1416" y="265" /><text fill="#31735d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1435" y="293">POOL GPU · WORKLOAD À DIMENSIONNER</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="1435" y="326">Ollama + Qwen local</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1435" y="356">Service interne ClusterIP</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1435" y="380">GPU, files bornées, VRAM, quotas</text><rect fill="#f5fbf6" height="155" rx="14" ry="14" stroke="#9bbfa7" stroke-width="1.6" width="336" x="1032" y="500" /><text fill="#31735d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1051" y="528">POOL APPLICATIF · DEPLOYMENT ENVISAGÉ</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="1051" y="561">Serveur MCP RH</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1051" y="591">Bearer local remplacé par identité</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1051" y="615">de workload + assertion utilisateur</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1051" y="639">ACL tenant / équipe / champs</text><rect fill="#f4f9fc" height="155" rx="14" ry="14" stroke="#91b7cd" stroke-width="1.6" width="403" x="1416" y="500" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1435" y="528">STOCKAGE À CONCEVOIR · NON ARRÊTÉ</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="1435" y="561">État applicatif + données RH</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1435" y="591">DB/PVC chiffrés, séparation tenant</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1435" y="615">Sauvegarde et restauration testées</text><rect fill="#fff8ed" height="146" rx="14" ry="14" stroke="#e2bd85" stroke-width="1.6" width="354" x="654" y="734" /><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="673" y="762">JOBS DE MIGRATION PROPOSÉS</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="673" y="795">Init / seed / bootstrap</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="673" y="825">Idempotence, pinning, secrets</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="673" y="849">Distribution isolée des workloads</text><rect fill="#fff8ed" height="146" rx="14" ry="14" stroke="#e2bd85" stroke-width="1.6" width="336" x="1032" y="734" /><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1051" y="762">CONTRÔLES TRANSVERSAUX</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="1051" y="795">Secrets + sessions</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1051" y="825">Workload ID, rotation, révocation</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1051" y="849">Rollback cohérent état + clé</text><rect fill="#f4f9fc" height="146" rx="14" ry="14" stroke="#91b7cd" stroke-width="1.6" width="403" x="1416" y="734" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1435" y="762">SÉCURITÉ / EXPLOITATION</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="1435" y="795">Audit et observabilité</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1435" y="825">Traces minimisées, p95, alarmes</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1435" y="849">Pannes, sauvegardes, charge</text><path d="M557,267 L647,267" fill="none" marker-end="url(#arrow)" stroke="#285c80" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M984,338 L1025,338" fill="none" marker-end="url(#arrow)" stroke="#285c80" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M1368,338 L1409,338" fill="none" marker-end="url(#arrow)" stroke="#285c80" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M1200,404 L1200,492" fill="none" marker-end="url(#arrow)" stroke="#285c80" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13.8" font-weight="700" x="1212" y="461">4 · appel MCP</text><path d="M1368,568 L1409,568" fill="none" marker-end="url(#arrow)" stroke="#285c80" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13.8" font-weight="700" x="1382" y="552">5</text><path d="M557,457 L606,457 L606,352 L647,352" fill="none" marker-end="url(#arrow-control)" stroke="#b07832" stroke-dasharray="10,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="13.8" font-weight="700" x="572" y="432">SSO / assertions</text><path d="M557,700 L622,700 L622,806 L647,806" fill="none" marker-end="url(#arrow-control)" stroke="#b07832" stroke-dasharray="10,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" /><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="13.8" font-weight="700" x="566" y="679">Approvisionnement maîtrisé</text><rect fill="#f9fafb" height="220" rx="19" ry="19" stroke="#bcd0d8" stroke-width="1.7" width="1816" x="42" y="962" /><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" x="64" y="993">GATES AVANT TOUTE DONNÉE RH RÉELLE</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.7" font-weight="400" x="67" y="1029">G1 · Fournisseur et région : garanties effectives du plan de contrôle, GPU, stockage, support, sauvegardes et sous-traitance.</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.7" font-weight="400" x="67" y="1057">G2 · Identité : OIDC + autorisation utilisateur vers MCP à audience bornée, non-usurpation, révocation et restauration cohérente.</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.7" font-weight="400" x="67" y="1085">G3 · Réseau : CNI, DNS, IPv4/IPv6, ingress/egress, approvisionnement et frontières navigateur/hôte testés.</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.7" font-weight="400" x="67" y="1113">G4 · Exploitation : disponibilité, latence p95, quotas GPU, stockage, PRA, audit et isolation validés sur le cluster réel.</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.7" font-weight="400" x="67" y="1141">G5 · Métier et conformité : traitement fictif pilote, autorisation/finalité, RGPD, DPO, AI Act selon usage réel.</text></svg>