<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">THIGA — Architecture du démonstrateur RH local</title>
  <desc id="desc">Chrome contacte WebUI sur le poste. Le garde filtre le namespace partagé. WebUI appelle Ollama et le MCP sur un réseau privé. Seul le job seed télécharge les poids sur un réseau distinct.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l10 5-10 5z" fill="#274f63"/></marker>
    <marker id="amber" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l10 5-10 5z" fill="#a2601c"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#142f3e}.title{font-size:41px;font-weight:700}.sub{font-size:19px;fill:#3d5765}.label{font-size:16px;font-weight:700;letter-spacing:1px}.head{font-size:25px;font-weight:700}.body{font-size:17px}.sm{font-size:14px}.flux{stroke:#274f63;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.seed{stroke:#a2601c;stroke-width:3.5;stroke-dasharray:8 6;fill:none;marker-end:url(#amber)}.block{fill:#fff;stroke:#8aa6b2;stroke-width:1.7}.boundary{fill:#f4fafc;stroke:#4d7787;stroke-width:2;stroke-dasharray:9 6}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#fff"/>
  <text x="48" y="63" class="title">THIGA | Agent RH local</text>
  <text x="50" y="99" class="sub">Du navigateur aux données RH fictives, avec séparation de l’inférence et du téléchargement initial.</text>

  <rect x="36" y="133" width="1190" height="687" rx="24" class="boundary"/>
  <text x="61" y="167" class="label">PÉRIMÈTRE DE CONFIANCE · POSTE + DOCKER DESKTOP / WSL2</text>

  <rect x="65" y="226" width="255" height="156" rx="16" class="block"/>
  <text x="86" y="267" class="head">Chrome</text>
  <text x="86" y="301" class="body">Session fictive authentifiée</text>
  <text x="86" y="328" class="body">Page restreinte par CSP</text>
  <text x="86" y="354" class="sm">Aucun port public</text>

  <rect x="429" y="199" width="345" height="288" rx="18" fill="#e6f3f3" stroke="#49807e" stroke-width="2"/>
  <text x="450" y="226" class="label">NAMESPACE PARTAGÉ</text>
  <rect x="449" y="244" width="304" height="86" rx="13" class="block"/>
  <text x="468" y="278" class="head">Garde nftables</text>
  <text x="468" y="307" class="body">NET_ADMIN seul · refus par défaut</text>
  <path d="M597 330v22" class="flux"/>
  <rect x="449" y="354" width="304" height="106" rx="13" class="block"/>
  <text x="468" y="387" class="head">Open WebUI</text>
  <text x="468" y="415" class="body">Orchestration · TCP 8080</text>
  <text x="468" y="442" class="sm">Garde et registre validés avant ouverture</text>
  <path d="M320 305h104" class="flux"/>
  <text x="323" y="267" class="sm">HTTP / WS</text>
  <text x="322" y="289" class="sm">127.0.0.1:3039</text>

  <rect x="891" y="187" width="305" height="317" rx="16" fill="#e8f1f7" stroke="#628ea5" stroke-width="2"/>
  <text x="911" y="215" class="label">RÉSEAU PRIVÉ INTERNE</text>
  <rect x="910" y="230" width="267" height="95" rx="12" class="block"/>
  <text x="928" y="266" class="head">Ollama</text>
  <text x="928" y="296" class="body">Qwen 3.5 9B · GPU local</text>
  <rect x="910" y="354" width="267" height="132" rx="12" class="block"/>
  <text x="928" y="390" class="head">MCP RH</text>
  <text x="928" y="419" class="body">Identité + droits côté serveur</text>
  <text x="928" y="445" class="sm">Annuaire et congés en lecture seule</text>
  <text x="928" y="468" class="sm">Audit de la décision</text>
  <path d="M754 377h71V273h81" class="flux"/>
  <text x="834" y="249" class="sm">HTTP</text>
  <text x="834" y="267" class="sm">11434</text>
  <path d="M754 425h152" class="flux"/>
  <text x="775" y="399" class="sm">MCP Streamable</text>
  <text x="775" y="417" class="sm">HTTP 8000</text>

  <rect x="65" y="551" width="479" height="205" rx="16" class="block"/>
  <text x="85" y="589" class="head">Amorçage local</text>
  <text x="85" y="622" class="body">Init crée les secrets dans des volumes privés.</text>
  <text x="85" y="650" class="body">Bootstrap provisionne les comptes et les droits.</text>
  <text x="85" y="678" class="body">Modèle, comptes, historique et audit persistent.</text>
  <text x="85" y="720" class="sm">Aucune donnée réelle dans le démonstrateur.</text>
  <path d="M449 552v-61" class="flux"/>

  <rect x="621" y="551" width="575" height="205" rx="16" fill="#fff7e8" stroke="#aa7944" stroke-width="1.8"/>
  <text x="646" y="589" class="label" style="fill:#784a1f">RÉSEAU DE DISTRIBUTION DISTINCT</text>
  <rect x="646" y="609" width="281" height="107" rx="12" class="block"/>
  <text x="665" y="646" class="head">Seed · job initial</text>
  <text x="665" y="676" class="body">Vérifie manifeste et blobs.</text>
  <text x="665" y="698" class="sm">Aucun montage de données RH.</text>
  <rect x="949" y="609" width="223" height="107" rx="12" class="block"/>
  <text x="966" y="646" class="head">Volume modèles</text>
  <text x="966" y="676" class="body">Poids Qwen vérifiés</text>
  <path d="M927 663h17" class="flux"/>
  <path d="M1060 608v-53h143V266h-22" class="flux"/>

  <rect x="1244" y="553" width="216" height="165" rx="15" fill="#fff7e8" stroke="#aa7944" stroke-width="1.8"/>
  <text x="1264" y="585" class="label" style="fill:#784a1f">HORS PÉRIMÈTRE</text>
  <text x="1264" y="626" class="head">Registre</text>
  <text x="1264" y="653" class="body">Images et poids</text>
  <text x="1264" y="686" class="sm">HTTPS au premier lancement</text>
  <path d="M787 716v61h563v-55" class="seed"/>
  <text x="914" y="805" class="sm" style="fill:#784a1f">Flux d’amorçage sortant, sans données RH</text>

  <text x="51" y="861" class="sm">Flèche pleine · flux local autorisé ou montage de volume</text>
  <text x="626" y="861" class="sm">Pointillés ocre · poids au seed. Images récupérées par Docker.</text>
</svg>
