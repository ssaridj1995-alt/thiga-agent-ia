<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1210" version="1.1" viewBox="0 0 1900 1210" width="1900" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>THIGA — Schéma d’architecture</title><desc>As-built exact de la livraison corrigée du 9 novembre 2026 : session Chrome, port loopback, namespace garde/WebUI, Ollama, MCP RH, 3 jobs, 7 volumes et limites de sécurité.</desc><defs><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#285c80" /></marker><marker id="arrow-control" markerHeight="11" markerWidth="11" orient="auto" refX="10" refY="5"><path d="M0 0 L10 5 L0 10 Z" fill="#b07832" /></marker></defs><rect fill="#ffffff" height="1210" width="1900" x="0" y="0" /><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" x="48" y="60">THIGA | Démonstrateur local — architecture réellement livrée</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" x="49" y="92">Docker Compose corrigé du 09/11/2026 · chemins de confiance, flux d’outils, amorçage et volumes</text><rect fill="#eaf6f2" height="31" rx="16" ry="16" stroke="none" stroke-width="0" width="320" x="1531" y="47" /><text fill="#31735d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1543" y="69">AS-BUILT · Code + Compose contrôlés</text><rect fill="#fbfcfd" height="812" rx="22" ry="22" stroke="#bdd0d9" stroke-dasharray="9,7" stroke-width="2" width="1816" x="42" y="136" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" x="66" y="168">FRONTIÈRE HÔTE : WINDOWS 11 / DOCKER DESKTOP / WSL2</text><rect fill="#fff" height="189" rx="14" ry="14" stroke="#b4cbd4" stroke-width="1.6" width="338" x="74" y="284" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="93" y="312">POSTE UTILISATEUR · HORS CONTENEUR</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="93" y="345">Navigateur Chrome</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="93" y="375">Session WebUI authentifiée</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="93" y="399">Requêtes HTTP + WebSocket</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="93" y="423">127.0.0.1:3039 (loopback)</text><rect fill="#f7f9fb" height="125" rx="12" ry="12" stroke="#c2d2db" stroke-width="1.7" width="338" x="74" y="501" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" x="92" y="530">LIMITES DU POSTE</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" x="92" y="556">Le navigateur et l’hôte ne sont</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" x="92" y="580">pas confinés par nftables Docker.</text><rect fill="#f5f9fa" height="708" rx="20" ry="20" stroke="#c6d8df" stroke-width="2" width="1370" x="450" y="202" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" x="473" y="231">PROJET COMPOSE · 7 services : 3 jobs + 4 processus persistants</text><rect fill="#eaf7f7" height="439" rx="18" ry="18" stroke="#73a7a6" stroke-dasharray="9,6" stroke-width="2" width="597" x="473" y="261" /><text fill="#087f81" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" x="490" y="291">NAMESPACE RÉSEAU COMMUN  ·  WEBUI + GARDE</text><rect fill="#f0faf9" height="167" rx="14" ry="14" stroke="#81bab7" stroke-width="1.6" width="522" x="510" y="320" /><text fill="#087f81" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="529" y="348">CONTENEUR WEBUI · AUCUNE CAPACITÉ LINUX</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="529" y="381">Open WebUI 0.12.5</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="529" y="411">Sessions, interface et orchestration</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="529" y="435">Requête → Ollama ; outil → MCP</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="529" y="459">Port interne 8080 ; volumes WebUI, clé</text><rect fill="#fff8ed" height="143" rx="14" ry="14" stroke="#e2bd85" stroke-width="1.6" width="522" x="510" y="520" /><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="529" y="548">CONTENEUR WEBUI-GUARD · NET_ADMIN</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="529" y="581">Garde nftables + signal</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="529" y="611">Règles egress ; santé ; fail-closed</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="529" y="635">Namespace partagé, pas de proxy HTTP</text><rect fill="#eef5fa" height="439" rx="18" ry="18" stroke="#90b5cb" stroke-dasharray="9,6" stroke-width="2" width="684" x="1108" y="261" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" x="1126" y="291">RÉSEAU « PRIVATE » · internal: true · non publié</text><rect fill="#f4f9fc" height="151" rx="14" ry="14" stroke="#91b7cd" stroke-width="1.6" width="600" x="1150" y="322" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1169" y="350">RUNTIME D’INFÉRENCE · PORT 11434</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="1169" y="383">Ollama 0.40.13 + Qwen3.5 9B</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1169" y="413">Modèle local Q4_K_M, GPU NVIDIA</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1169" y="437">Propose tool_calls ; ne détient pas les droits RH</text><rect fill="#f5fbf6" height="143" rx="14" ry="14" stroke="#9bbfa7" stroke-width="1.6" width="600" x="1150" y="522" /><text fill="#31735d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1169" y="550">SERVICE MCP · PORT 8000 · HTTP STREAMABLE</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="1169" y="583">MCP RH Python / SDK 2.3.0</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1169" y="613">Bearer de service + ID WebUI backend</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1169" y="637">ACL tenant / relation + audit minimal</text><path d="M412,375 L501,375" fill="none" marker-end="url(#arrow)" stroke="#285c80" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M1032,370 L1142,370" fill="none" marker-end="url(#arrow)" stroke="#285c80" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M1032,445 L1088,445 L1088,585 L1142,585" fill="none" marker-end="url(#arrow)" stroke="#285c80" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M907,520 L907,494" fill="none" marker-end="url(#arrow-control)" stroke="#b07832" stroke-dasharray="10,8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><text fill="#b07832" font-family="Segoe UI, Arial, sans-serif" font-size="13.8" font-weight="700" x="705" y="509">Contrôle avant ouverture</text><rect fill="#f1f5f7" height="31" rx="16" ry="16" stroke="none" stroke-width="0" width="540" x="1170" y="676" /><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1182" y="698">Retour MCP → WebUI → Ollama (formulation) → navigateur</text><rect fill="#ffffff" height="154" rx="16" ry="16" stroke="#bed1d8" stroke-width="1.7" width="1319" x="473" y="729" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" x="491" y="758">CYCLE D’AMORÇAGE · services terminés avant disponibilité fonctionnelle</text><rect fill="#fff" height="107" rx="14" ry="14" stroke="#b4cbd4" stroke-width="1.6" width="397" x="492" y="768" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="511" y="796">JOB · RÉSEAU : NONE</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="511" y="829">init</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="511" y="859">Clés, secrets et état initial</text><rect fill="#fff" height="107" rx="14" ry="14" stroke="#b4cbd4" stroke-width="1.6" width="407" x="904" y="768" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="923" y="796">JOB · RÉSEAU : DISTRIBUTION</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="923" y="829">seed</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="923" y="859">Poids / digests → volume models</text><rect fill="#fff" height="107" rx="14" ry="14" stroke="#b4cbd4" stroke-width="1.6" width="446" x="1326" y="768" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1345" y="796">JOB · RÉSEAU : PRIVATE</text><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" x="1345" y="829">bootstrap</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.8" font-weight="400" x="1345" y="859">Comptes, grants, connexion MCP</text><rect fill="#fff" height="222" rx="15" ry="15" stroke="#bed1d8" stroke-width="1.7" width="338" x="74" y="661" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" x="93" y="692">7 VOLUMES NOMMÉS</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" x="94" y="724">admin · webkeys · mcpstate</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" x="94" y="753">audit · webui · models</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" x="94" y="782">guard_status (signal de garde)</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" x="94" y="833">Accès via montages déclarés</text><rect fill="#f7fafc" height="180" rx="19" ry="19" stroke="#c7d8e0" stroke-width="1.7" width="1816" x="42" y="980" /><text fill="#173247" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" x="66" y="1012">LIMITES DE LA PREUVE ET POINTS DE VIGILANCE</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.7" font-weight="400" x="68" y="1045">Autorisation : décision déterministe dans MCP ; la proposition d’outil du LLM ne prouve jamais un droit ni l’intention du tour.</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.7" font-weight="400" x="68" y="1072">Confinement : garde et sondes qualifiés sur des chemins bornés ; E05 (navigateur / hôte / sorties générales) reste PARTIEL.</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.7" font-weight="400" x="68" y="1099">D05 injection indirecte et E09 résilience : preuves limitées, pas de garantie générale ; aucune donnée RH réelle.</text><text fill="#526b7d" font-family="Segoe UI, Arial, sans-serif" font-size="15.7" font-weight="400" x="68" y="1126">Images OCI de base nécessaires à la reconstruction exacte : présentes dans le ZIP technique, absentes du clone GitHub seul.</text><path d="M1602,940 L1715,940" fill="none" stroke="#285c80" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><text fill="#285c80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" x="1452" y="935">Flux applicatif</text></svg>